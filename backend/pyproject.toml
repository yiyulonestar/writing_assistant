[project]
name = "writing-assistant-backend"
version = "0.1.0"
description = "长篇小说 / 网文创作辅助 Agent 后端"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "tortoise-orm>=1.1",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "openai>=3.0",
    "httpx>=0.27",
    "langgraph>=0.2",
    "tzdata; sys_platform == 'win32'",
    "sentence-transformers>=6.0.0",
]

[project.optional-dependencies]
# 本地嵌入编码（bge-small-zh 走 sentence-transformers，依赖 torch，体积大，按需安装）
embeddings = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "aiosqlite>=0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
asyncio_mode = "auto"
